<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KoboldlyGo Character Creator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Kobold Krafter</h1>

    <div class="creator">

        <div class="preview-panel">

            <canvas
                id="characterCanvas"
                width="800"
                height="1000">
            </canvas>

            <div class="action-buttons">
                <button type="button" id="randomizeButton">Randomize</button>
                <button type="button" id="clearButton">Reset</button>
            </div>

        </div>

        <div class="controls">

            <section class="control-section">
                <h2>Background</h2>
                <div id="backgroundOptions" class="option-grid"></div>
            </section>


            <section class="control-section">
                <h2>Colors</h2>

                <div class="color-controls">

                    <label for="primaryColor">Body Primary:</label>
                    <input
                        type="color"
                        id="primaryColor"
                    >

                    <label for="secondaryColor">Body Secondary:</label>
                    <input
                        type="color"
                        id="secondaryColor"
                    >

                    <label for="limbSecondaryColor">Hands/Feet Secondary:</label>
                    <input
                        type="color"
                        id="limbSecondaryColor"
                    >

                    <label for="clawColor">Claws:</label>
                    <input
                        type="color"
                        id="clawColor"
                    >

                    <label for="hornColor">Horns:</label>
                    <input
                        type="color"
                        id="hornColor"
                    >

                    <label for="eyeColor">Eyes:</label>
                    <input
                        type="color"
                        id="eyeColor"
                    >

                    <label for="scaleColor">Scales:</label>
                    <input
                        type="color"
                        id="scaleColor"
                    >

                    <label for="plateColor">Plates:</label>
                    <input
                        type="color"
                        id="plateColor"
                    >

                    
                    <label for="browColor">Brow:</label>
                    <input
                        type="color"
                        id="browColor"
                    >

                    <label for="finColor">Fins:</label>
                    <input
                        type="color"
                        id="finColor"
                    >

                    <label for="earColor">Ears:</label>
                    <input
                        type="color"
                        id="earColor"
                    >
                </div>
            </section>

            <section class="control-section">
                <h2 id="muzzleLabel">
                    <span class="part-title">Muzzle:</span>
                    <span class="part-selection-name"></span>
                </h2>
                <div id="muzzleOptions" class="option-grid"></div>
                <div id="muzzleFlatToggles" class="flat-toggle-group"></div>
            </section>

            <section class="control-section">
                <h2 id="browLabel">
                    <span class="part-title">Brow:</span>
                    <span class="part-selection-name"></span>
                </h2>
                <div id="browOptions" class="option-grid"></div>
                <div id="browFlatToggles" class="flat-toggle-group"></div>
            </section>

            <section class="control-section">
                <h2 id="sideLabel">
                    <span class="part-title">Side:</span>
                    <span class="part-selection-name"></span>
                </h2>
                <div id="sideOptions" class="option-grid"></div>
                <div id="sideFlatToggles" class="flat-toggle-group"></div>
            </section>


            <section class="control-section">
                <h2 id="eyesLabel">
                    <span class="part-title">Eyes:</span>
                    <span class="part-selection-name"></span>
                </h2>
                <div id="eyesOptions" class="option-grid"></div>
                <div id="eyesFlatToggles" class="flat-toggle-group"></div>
            </section>


            <section class="control-section">
                <h2 id="hornsLabel">
                    <span class="part-title">Horns:</span>
                    <span class="part-selection-name"></span>
                </h2>
                <div id="hornOptions" class="option-grid"></div>
                <div id="hornFlatToggles" class="flat-toggle-group"></div>
            </section>

            <section class="control-section">
                <h2 id="tailLabel">
                    <span class="part-title">Tail:</span>
                    <span class="part-selection-name"></span>
                </h2>
                <div id="tailOptions" class="option-grid"></div>
                <div id="tailFlatToggles" class="flat-toggle-group"></div>
            </section>


            <section class="control-section">
                <h2 id="feetLabel">
                    <span class="part-title">Feet:</span>
                    <span class="part-selection-name"></span>
                </h2>
                <div id="feetOptions" class="option-grid"></div>
                <div id="feetFlatToggles" class="flat-toggle-group"></div>
            </section>


            <section class="control-section">
                <h2 id="bodyLabel">
                    <span class="part-title">Body:</span>
                    <span class="part-selection-name"></span>
                </h2>
                <div id="bodyOptions" class="option-grid"></div>
                <div id="bodyFlatToggles" class="flat-toggle-group"></div>
            </section>


            <section class="control-section">
                <h2 id="handsLabel">
                    <span class="part-title">Hands:</span>
                    <span class="part-selection-name"></span>
                </h2>
                <div id="handsOptions" class="option-grid"></div>
                <div id="handsFlatToggles" class="flat-toggle-group"></div>
            </section>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
