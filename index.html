<!DOCTYPE html>
<html>

<head>
    <title>KoboldlyGo Character Creator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Character Creator</h1>

    <div class="creator">

        <canvas
            id="characterCanvas"
            width="200"
            height="200">
        </canvas>

        <div class="controls">

            <h2>Background</h2>

            <button onclick="changeBackground(-1)">Previous</button>
            <button onclick="changeBackground(1)">Next</button>

            <h2>Body</h2>

            <button onclick="changeBody(-1)">Previous</button>
            <button onclick="changeBody(1)">Next</button>

            <h2>Face</h2>

            <button onclick="changeFace(-1)">Previous</button>
            <button onclick="changeFace(1)">Next</button>

            <h2>Horns</h2>

            <button onclick="changeHorns(-1)">Previous</button>
            <button onclick="changeHorns(1)">Next</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
