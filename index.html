<!DOCTYPE html>
<html>

<head>
    <title>KoboldlyGo Character Creator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Character Creator</h1>

    <div class="creator">

        <div class="preview-panel">

            <canvas
                id="characterCanvas"
                width="200"
                height="200">
            </canvas>

            <div class="action-buttons">
                <button id="randomizeButton">Randomize</button>
                <button id="clearButton">Clear</button>
            </div>

        </div>

        <div class="controls">

            <h2>Background</h2>
            <div id="backgroundOptions" class="option-grid"></div>

            <h2>Body</h2>
            <div id="bodyOptions" class="option-grid"></div>

            <h2>Face</h2>
            <div id="faceOptions" class="option-grid"></div>

            <h2>Horns</h2>
            <div id="hornOptions" class="option-grid"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
